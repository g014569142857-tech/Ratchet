[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ratchet-ai"
version = "0.2.0"
description = "A local-first self-improvement engine that makes any LLM better the more you use it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ratchet Contributors" }]
keywords = [
    "llm",
    "reinforcement-learning",
    "thompson-sampling",
    "memory",
    "reflexion",
    "agent",
    "self-improvement",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Intentionally empty. The core loop - store, retrieval, bandit, verifier,
# reflector, evolver, distiller, profile, governance and the web console - is
# standard library only, so a first install stays small, offline and auditable.
# Nothing outside `train/` may import a third-party package.
dependencies = []

[project.optional-dependencies]
# Real parameter updates for open-weight models (Route A). Needs a GPU.
train = ["trl>=0.9", "peft>=0.11", "datasets>=2.19", "transformers>=4.40"]
# Model Context Protocol adapter, so agents like Cursor / Claude Desktop can mount Ratchet.
mcp = ["mcp>=1.0,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/ratchet-ai/ratchet"
Documentation = "https://github.com/ratchet-ai/ratchet#readme"
Issues = "https://github.com/ratchet-ai/ratchet/issues"

[project.scripts]
ratchet = "ratchet.cli.main:main"
ratchet-mcp = "ratchet.adapters.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true

# The two optional backends are imported lazily and are not installed in CI, so
# their modules cannot be resolved. Ignoring them keeps `mypy src` meaningful
# instead of drowning the real findings in import errors.
[[tool.mypy.overrides]]
module = ["mcp.*", "trl.*", "peft.*", "datasets.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The web console ships its HTML, CSS and JS as one inline template string.
# Reflowing that to 100 columns would make the markup unreadable to gain nothing,
# so line length is waived for this one file.
"src/ratchet/adapters/web.py" = ["E501"]
